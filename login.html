<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <a href="index.html" class="text-4xl">📚</a>
            <h1 class="text-2xl font-bold text-slate-800 mt-2">Study Hub</h1>
            <p class="text-sm text-gray-500">আপনার অ্যাকাউন্টে লগইন করুন</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-6 md:p-8">
            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Email -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">ইমেইল</label>
                    <input type="email" id="loginEmail" required
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-sm"
                           placeholder="your@email.com">
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <label class="block text-sm font-semibold text-slate-700 mb-1.5">পাসওয়ার্ড</label>
                    <input type="password" id="loginPassword" required
                           class="w-full px-4 py-2.5 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none transition-all text-sm"
                           placeholder="••••••••">
                </div>

                <!-- Remember Me -->
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center gap-2 text-sm text-gray-600">
                        <input type="checkbox" class="rounded border-gray-300 text-primary focus:ring-primary">
                        মনে রাখুন
                    </label>
                    <a href="#" class="text-sm text-primary hover:underline">পাসওয়ার্ড ভুলে গেছেন?</a>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn"
                        class="w-full btn-primary py-3 text-base">
                    <i class="fas fa-sign-in-alt mr-2"></i> লগইন করুন
                </button>

                <!-- Divider -->
                <div class="flex items-center gap-4 my-6">
                    <div class="flex-1 h-px bg-gray-200"></div>
                    <span class="text-xs text-gray-400">অথবা</span>
                    <div class="flex-1 h-px bg-gray-200"></div>
                </div>

                <!-- Google Login -->
                <button type="button" onclick="handleGoogleLogin()"
                        class="w-full flex items-center justify-center gap-3 py-2.5 rounded-xl border border-gray-200 hover:bg-gray-50 transition-all text-sm font-medium text-slate-700">
                    <img src="https://www.google.com/favicon.ico" class="w-5 h-5" alt="Google">
                    Google দিয়ে লগইন করুন
                </button>

                <!-- Signup Link -->
                <p class="text-center text-sm text-gray-600 mt-6">
                    অ্যাকাউন্ট নেই? <a href="signup.html" class="text-primary font-semibold hover:underline">রেজিস্টার করুন</a>
                </p>
            </form>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast-notification"></div>

    <script type="module">
        import { auth, signInWithEmailAndPassword, signInWithPopup, provider, onAuthStateChanged } from './firebase-config.js';

        // Check if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = 'index.html';
            }
        });

        window.handleLogin = async function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('loginBtn');
            
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> লগইন হচ্ছে...';
            btn.disabled = true;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast('✅ লগইন সফল!');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } catch (error) {
                let msg = 'লগইন ব্যর্থ!';
                if (error.code === 'auth/user-not-found') msg = 'ইমেইল পাওয়া যায়নি';
                else if (error.code === 'auth/wrong-password') msg = 'ভুল পাসওয়ার্ড';
                else if (error.code === 'auth/too-many-requests') msg = 'অনেক চেষ্টা করেছেন, পরে আবার চেষ্টা করুন';
                showToast('❌ ' + msg);
                btn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i> লগইন করুন';
                btn.disabled = false;
            }
        };

        window.handleGoogleLogin = async function() {
            try {
                await signInWithPopup(auth, provider);
                showToast('✅ Google লগইন সফল!');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } catch (error) {
                showToast('❌ Google লগইন ব্যর্থ: ' + error.message);
            }
        };

        window.showToast = function(message) {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };
    </script>
</body>
</html>
