<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অ্যাডমিন প্যানেল - Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../style.css">
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Admin Header -->
    <header class="sticky top-0 z-50 bg-white border-b border-gray-200 shadow-sm">
        <div class="container mx-auto max-w-7xl px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="../index.html" class="text-2xl">📚</a>
                <span class="font-bold text-slate-800">অ্যাডমিন প্যানেল</span>
                <span class="text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full">v1.0</span>
            </div>
            <div class="flex items-center gap-3">
                <span class="text-sm text-gray-600 hidden sm:inline" id="adminName">অ্যাডমিন</span>
                <button onclick="logoutAdmin()" class="text-sm text-red-500 hover:text-red-700">
                    <i class="fas fa-sign-out-alt"></i> প্রস্থান
                </button>
            </div>
        </div>
    </header>

    <!-- Admin Nav -->
    <nav class="bg-white border-b border-gray-200 overflow-x-auto no-scrollbar">
        <div class="container mx-auto max-w-7xl px-4 py-2 flex gap-1">
            <a href="index.html" class="admin-nav-link active">📊 ড্যাশবোর্ড</a>
            <a href="users.html" class="admin-nav-link">👥 ইউজার</a>
            <a href="sessions.html" class="admin-nav-link">📚 সেশন</a>
            <a href="leaderboard.html" class="admin-nav-link">🏆 লিডারবোর্ড</a>
            <a href="tasks.html" class="admin-nav-link">📝 টাস্ক</a>
            <a href="quizzes.html" class="admin-nav-link">❓ কুইজ</a>
            <a href="settings.html" class="admin-nav-link">⚙️ সেটিংস</a>
        </div>
    </nav>

    <!-- Main -->
    <main class="container mx-auto max-w-7xl px-4 py-6">

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="card text-center">
                <div class="text-2xl font-bold text-primary" id="totalUsers">0</div>
                <div class="text-xs text-gray-500">মোট ইউজার</div>
            </div>
            <div class="card text-center">
                <div class="text-2xl font-bold text-emerald-600" id="totalSessions">0</div>
                <div class="text-xs text-gray-500">মোট সেশন</div>
            </div>
            <div class="card text-center">
                <div class="text-2xl font-bold text-amber-600" id="todaySessions">0</div>
                <div class="text-xs text-gray-500">আজকের সেশন</div>
            </div>
            <div class="card text-center">
                <div class="text-2xl font-bold text-purple-600" id="totalQuizzes">0</div>
                <div class="text-xs text-gray-500">মোট কুইজ</div>
            </div>
        </div>

        <!-- Recent Activity -->
        <div class="grid md:grid-cols-2 gap-6">
            <!-- Recent Users -->
            <div class="card">
                <h3 class="font-bold text-slate-800 mb-3">🆕 সাম্প্রতিক ইউজার</h3>
                <div id="recentUsers" class="space-y-2 max-h-64 overflow-y-auto">
                    <div class="text-center text-gray-400 text-sm py-4">লোড হচ্ছে...</div>
                </div>
            </div>

            <!-- Recent Sessions -->
            <div class="card">
                <h3 class="font-bold text-slate-800 mb-3">📊 সাম্প্রতিক সেশন</h3>
                <div id="recentSessions" class="space-y-2 max-h-64 overflow-y-auto">
                    <div class="text-center text-gray-400 text-sm py-4">লোড হচ্ছে...</div>
                </div>
            </div>
        </div>

        <!-- Quick Actions -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6">
            <button onclick="exportData()" class="btn-primary py-3 text-sm">
                <i class="fas fa-download mr-2"></i> ডেটা এক্সপোর্ট
            </button>
            <button onclick="resetLeaderboard()" class="btn-secondary py-3 text-sm text-red-500 border-red-200 hover:bg-red-50">
                <i class="fas fa-sync-alt mr-2"></i> লিডারবোর্ড রিসেট
            </button>
            <button onclick="viewAllUsers()" class="btn-secondary py-3 text-sm">
                <i class="fas fa-users mr-2"></i> সব ইউজার দেখুন
            </button>
            <a href="../quiz-creator.html" class="btn-secondary py-3 text-sm text-center">
                <i class="fas fa-plus mr-2"></i> নতুন কুইজ
            </a>
        </div>

    </main>

    <!-- Toast -->
    <div id="toast-notification"></div>

    <style>
        .admin-nav-link {
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            border-radius: 8px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .admin-nav-link:hover { background: #f1f5f9; color: #2563eb; }
        .admin-nav-link.active { background: #eff6ff; color: #2563eb; }
    </style>

    <script type="module">
        import { auth, onAuthStateChanged, db, collection, getDocs, query, orderBy, limit, doc, getDoc, deleteDoc, writeBatch } from '../firebase-config.js';
        import { isAdmin, requireAdmin } from '../admin.js';

        // Admin guard
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = '../login.html';
                return;
            }
            const admin = await isAdmin(user.uid);
            if (!admin) {
                window.location.href = '../index.html';
                return;
            }
            document.getElementById('adminName').textContent = user.displayName || 'অ্যাডমিন';
            loadDashboard();
        });

        window.logoutAdmin = function() {
            import('../firebase-config.js').then(({ signOut }) => {
                signOut(auth).then(() => window.location.href = '../login.html');
            });
        };

        async function loadDashboard() {
            try {
                // Total Users
                const usersSnap = await getDocs(collection(db, 'users'));
                document.getElementById('totalUsers').textContent = usersSnap.size;

                // Total Sessions
                const sessionsSnap = await getDocs(collection(db, 'study_sessions'));
                document.getElementById('totalSessions').textContent = sessionsSnap.size;

                // Today's Sessions
                const today = new Date().toISOString().split('T')[0];
                let todayCount = 0;
                sessionsSnap.forEach(doc => {
                    if (doc.data().date === today) todayCount++;
                });
                document.getElementById('todaySessions').textContent = todayCount;

                // Total Quizzes
                const quizzesSnap = await getDocs(collection(db, 'quizzes'));
                document.getElementById('totalQuizzes').textContent = quizzesSnap.size;

                // Recent Users
                const usersQuery = query(collection(db, 'users'), orderBy('createdAt', 'desc'), limit(10));
                const recentUsersSnap = await getDocs(usersQuery);
                const usersContainer = document.getElementById('recentUsers');
                usersContainer.innerHTML = '';
                recentUsersSnap.forEach(doc => {
                    const data = doc.data();
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm';
                    div.innerHTML = `
                        <span>${data.name || 'Unknown'}</span>
                        <span class="text-xs text-gray-400">${data.group || 'No Group'}</span>
                    `;
                    usersContainer.appendChild(div);
                });
                if (recentUsersSnap.empty) {
                    usersContainer.innerHTML = '<div class="text-center text-gray-400 text-sm py-4">কোনো ইউজার নেই</div>';
                }

                // Recent Sessions
                const sessionsQuery = query(collection(db, 'study_sessions'), orderBy('createdAt', 'desc'), limit(10));
                const recentSessionsSnap = await getDocs(sessionsQuery);
                const sessionsContainer = document.getElementById('recentSessions');
                sessionsContainer.innerHTML = '';
                recentSessionsSnap.forEach(doc => {
                    const data = doc.data();
                    const dur = data.duration || 0;
                    const h = Math.floor(dur / 3600);
                    const m = Math.floor((dur % 3600) / 60);
                    const timeStr = h > 0 ? `${h}h ${m}m` : `${m}m`;
                    const div = document.createElement('div');
                    div.className = 'flex justify-between items-center p-2 bg-gray-50 rounded-lg text-sm';
                    div.innerHTML = `
                        <span>${data.userName || 'User'} - ${timeStr}</span>
                        <span class="text-xs text-gray-400">${data.type || 'self_study'}</span>
                    `;
                    sessionsContainer.appendChild(div);
                });
                if (recentSessionsSnap.empty) {
                    sessionsContainer.innerHTML = '<div class="text-center text-gray-400 text-sm py-4">কোনো সেশন নেই</div>';
                }

            } catch (e) {
                console.error('Error loading dashboard:', e);
                showToast('❌ ডেটা লোড করতে ব্যর্থ');
            }
        }

        window.exportData = function() {
            showToast('📥 ডেটা এক্সপোর্ট শুরু হচ্ছে...');
            // Implement CSV export later
        };

        window.resetLeaderboard = function() {
            if (confirm('লিডারবোর্ড রিসেট করবেন? সব ডেটা মুছে যাবে!')) {
                showToast('🔄 লিডারবোর্ড রিসেট হচ্ছে...');
                // Implement reset later
            }
        };

        window.viewAllUsers = function() {
            window.location.href = 'users.html';
        };

        window.showToast = function(message) {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };
    </script>
</body>
</html>
