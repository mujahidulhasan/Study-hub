<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রোফাইল - Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/66ce5ae449.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { font-family: 'Hind Siliguri', sans-serif !important; }
        .stat-box {
            background: white;
            border-radius: 12px;
            border: 1px solid #F1F5F9;
            padding: 16px;
            text-align: center;
            transition: all 0.2s;
        }
        .stat-box:hover { border-color: #CBD5E1; }
        .stat-box .number { font-size: 24px; font-weight: 800; color: #0F172A; }
        .stat-box .label { font-size: 11px; color: #94A3B8; margin-top: 2px; }
        .stat-box .icon { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="sticky top-2 z-50 w-full flex justify-center px-4 mt-2">
        <div class="bg-white/80 backdrop-blur-xl border border-gray-200 rounded-full w-full max-w-5xl flex items-center gap-1 p-1.5 shadow-lg shadow-blue-500/5">
            <a href="index.html" class="flex items-center gap-2 pl-3 pr-2 shrink-0 no-underline">
                <i class="fas fa-graduation-cap text-2xl text-primary"></i>
                <span class="font-bold text-lg bg-gradient-to-r from-primary to-blue-400 bg-clip-text text-transparent hidden sm:block">Study Hub</span>
            </a>
            <div class="h-6 w-px bg-gray-200 mx-2 hidden sm:block"></div>
            <nav class="flex-grow flex items-center overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-1 px-2">
                    <a href="index.html" class="nav-link">হোম</a>
                    <a href="tracker.html" class="nav-link">ট্র্যাকার</a>
                    <a href="leaderboard.html" class="nav-link">লিডারবোর্ড</a>
                    <a href="todo.html" class="nav-link">টু-ডু</a>
                </div>
            </nav>
            <div class="flex items-center gap-2 shrink-0 ml-auto" id="authSection">
                <a href="login.html" class="inline-flex items-center justify-center rounded-full bg-primary text-white px-5 py-1.5 text-sm font-medium hover:bg-primaryDark shadow-lg shadow-blue-500/30 transition-all">
                    <i class="fas fa-sign-in-alt mr-2"></i> লগইন
                </a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto max-w-3xl px-4 py-6">

        <!-- Profile Card -->
        <div class="card p-6 md:p-8">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="w-24 h-24 rounded-full bg-gradient-to-r from-primary to-blue-400 flex items-center justify-center text-white text-3xl font-bold flex-shrink-0">
                    <i class="fas fa-user"></i>
                </div>
                <div class="flex-1 text-center md:text-left">
                    <h2 class="text-2xl font-bold text-slate-800" id="profileName">ইউজার</h2>
                    <p class="text-sm text-slate-500" id="profileEmail">email@example.com</p>
                    <div class="flex flex-wrap gap-2 mt-2 justify-center md:justify-start">
                        <span class="text-xs bg-blue-50 text-blue-600 px-3 py-1 rounded-full border border-blue-100" id="profileGroup">গ্রুপ: HSC 27</span>
                        <span class="text-xs bg-purple-50 text-purple-600 px-3 py-1 rounded-full border border-purple-100" id="profileRole">রোল: ইউজার</span>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="window.location.href='tracker.html'" class="btn-primary text-sm px-4 py-2">
                        <i class="fas fa-play mr-2"></i> স্টাডি শুরু
                    </button>
                    <button onclick="logout()" class="btn-secondary text-sm px-4 py-2 text-red-500 border-red-200 hover:bg-red-50">
                        <i class="fas fa-sign-out-alt mr-2"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6">
            <div class="stat-box">
                <div class="icon text-emerald-500"><i class="fas fa-clock"></i></div>
                <div class="number" id="totalStudy">০</div>
                <div class="label">মোট স্টাডি</div>
            </div>
            <div class="stat-box">
                <div class="icon text-blue-500"><i class="fas fa-calendar-day"></i></div>
                <div class="number" id="todayStudy">০</div>
                <div class="label">আজকের স্টাডি</div>
            </div>
            <div class="stat-box">
                <div class="icon text-amber-500"><i class="fas fa-fire"></i></div>
                <div class="number" id="streak">০</div>
                <div class="label">স্ট্রিক (দিন)</div>
            </div>
            <div class="stat-box">
                <div class="icon text-purple-500"><i class="fas fa-trophy"></i></div>
                <div class="number" id="rank">-#</div>
                <div class="label">লিডারবোর্ড র‍্যাঙ্ক</div>
            </div>
        </div>

        <!-- Edit Profile -->
        <div class="card mt-6">
            <h3 class="font-bold text-slate-800 mb-4"><i class="fas fa-edit text-primary mr-2"></i> প্রোফাইল আপডেট</h3>
            <form id="profileForm" onsubmit="updateProfile(event)">
                <div class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">নাম</label>
                        <input type="text" id="editName" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">গ্রুপ</label>
                        <select id="editGroup" class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm">
                            <option value="SSC 26">SSC 26</option>
                            <option value="SSC 27">SSC 27</option>
                            <option value="HSC 26">HSC 26</option>
                            <option value="HSC 27">HSC 27</option>
                            <option value="HSC 28">HSC 28</option>
                            <option value="Admission">Admission</option>
                            <option value="Admission 25-26">Admission 25-26</option>
                            <option value="Medical">Medical</option>
                            <option value="No Group">No Group</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-primary mt-4 text-sm px-6 py-2">
                    <i class="fas fa-save mr-2"></i> আপডেট করুন
                </button>
            </form>
        </div>

    </main>

    <!-- Toast -->
    <div id="toast-notification"></div>

    <script type="module">
        import { auth, onAuthStateChanged, db, doc, getDoc, updateDoc, collection, getDocs, query, where } from './firebase-config.js';

        let currentUser = null;
        let userData = null;

        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                currentUser = user;
                authSection.innerHTML = `
                    <a href="profile.html" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 text-primary hover:bg-blue-100 transition-all">
                        <i class="fas fa-user-circle text-lg"></i>
                        <span class="text-sm font-medium hidden sm:inline">${user.displayName || 'User'}</span>
                    </a>
                    <button onclick="logout()" class="p-2 text-gray-400 hover:text-red-500">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                `;
                loadProfile();
            } else {
                authSection.innerHTML = `
                    <a href="login.html" class="inline-flex items-center justify-center rounded-full bg-primary text-white px-5 py-1.5 text-sm font-medium hover:bg-primaryDark shadow-lg shadow-blue-500/30 transition-all">
                        <i class="fas fa-sign-in-alt mr-2"></i> লগইন
                    </a>
                `;
                document.getElementById('profileName').textContent = 'অতিথি';
                document.getElementById('profileEmail').textContent = 'লগইন করুন';
            }
        });

        window.logout = function() {
            import('./firebase-config.js').then(({ signOut }) => {
                signOut(auth).then(() => window.location.href = 'index.html');
            });
        };

        async function loadProfile() {
            if (!currentUser) return;
            try {
                const docSnap = await getDoc(doc(db, 'users', currentUser.uid));
                if (docSnap.exists()) {
                    userData = docSnap.data();
                    document.getElementById('profileName').textContent = userData.name || 'ইউজার';
                    document.getElementById('profileEmail').textContent = currentUser.email;
                    document.getElementById('profileGroup').textContent = `গ্রুপ: ${userData.group || 'No Group'}`;
                    document.getElementById('profileRole').textContent = `রোল: ${userData.role || 'ইউজার'}`;
                    document.getElementById('editName').value = userData.name || '';
                    document.getElementById('editGroup').value = userData.group || 'No Group';
                    loadStats();
                }
            } catch (e) {
                console.error('Error loading profile:', e);
            }
        }

        async function loadStats() {
            try {
                const today = new Date().toISOString().split('T')[0];
                const q = query(
                    collection(db, 'study_sessions'),
                    where('userId', '==', currentUser.uid)
                );
                const snap = await getDocs(q);
                let total = 0;
                let todayTotal = 0;
                let days = new Set();
                
                snap.forEach(doc => {
                    const data = doc.data();
                    const dur = data.duration || 0;
                    total += dur;
                    days.add(data.date);
                    if (data.date === today) todayTotal += dur;
                });

                document.getElementById('totalStudy').textContent = formatTime(total);
                document.getElementById('todayStudy').textContent = formatTime(todayTotal);
                document.getElementById('streak').textContent = days.size;

                // Get rank (simplified)
                const leaderboardSnap = await getDocs(collection(db, 'leaderboard_daily', today, 'users'));
                let rank = 1;
                leaderboardSnap.forEach(doc => {
                    if (doc.id === currentUser.uid) {
                        document.getElementById('rank').textContent = `#${rank}`;
                    }
                    rank++;
                });
                if (rank > leaderboardSnap.size + 1) {
                    document.getElementById('rank').textContent = '-';
                }

            } catch (e) {
                console.error('Error loading stats:', e);
            }
        }

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            return h > 0 ? `${h}ঘ ${m}মি` : `${m}মি`;
        }

        window.updateProfile = async function(e) {
            e.preventDefault();
            if (!currentUser) return;
            const name = document.getElementById('editName').value.trim();
            const group = document.getElementById('editGroup').value;
            if (!name) { showToast('⚠️ নাম লিখুন'); return; }

            try {
                await updateDoc(doc(db, 'users', currentUser.uid), {
                    name: name,
                    group: group
                });
                showToast('✅ প্রোফাইল আপডেট করা হয়েছে');
                loadProfile();
            } catch (e) {
                showToast('❌ আপডেট করতে ব্যর্থ');
            }
        };

        window.showToast = function(message) {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };
    </script>
</body>
</html>
