<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>গ্রুপ লিডারবোর্ড - Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/66ce5ae449.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { font-family: 'Hind Siliguri', sans-serif !important; }
        .team-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #F1F5F9;
            padding: 16px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .team-card:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.06); }
        .team-rank {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .team-rank-1 { background: #F59E0B; color: white; }
        .team-rank-2 { background: #94A3B8; color: white; }
        .team-rank-3 { background: #FB923C; color: white; }
        .team-rank-normal { background: #F1F5F9; color: #64748B; }
        .member-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #E2E8F0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 600;
            color: #475569;
            border: 2px solid white;
            margin-left: -6px;
        }
        .member-avatar:first-child { margin-left: 0; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="sticky top-2 z-50 w-full flex justify-center px-4 mt-2">
        <div class="bg-white/80 backdrop-blur-xl border border-gray-200 rounded-full w-full max-w-5xl flex items-center gap-1 p-1.5 shadow-lg shadow-blue-500/5">
            <a href="index.html" class="flex items-center gap-2 pl-3 pr-2 shrink-0 no-underline">
                <i class="fas fa-graduation-cap text-2xl text-primary"></i>
                <span class="font-bold text-lg bg-gradient-to-r from-primary to-blue-400 bg-clip-text text-transparent hidden sm:block">Study Hub</span>
            </a>
            <div class="h-6 w-px bg-gray-200 mx-2 hidden sm:block"></div>
            <nav class="flex-grow flex items-center overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-1 px-2">
                    <a href="index.html" class="nav-link">হোম</a>
                    <a href="tracker.html" class="nav-link">ট্র্যাকার</a>
                    <a href="leaderboard.html" class="nav-link">লিডারবোর্ড</a>
                    <a href="group-leaderboard.html" class="nav-link active">গ্রুপ লিডারবোর্ড</a>
                </div>
            </nav>
            <div class="flex items-center gap-2 shrink-0 ml-auto" id="authSection">
                <a href="login.html" class="inline-flex items-center justify-center rounded-full bg-primary text-white px-5 py-1.5 text-sm font-medium hover:bg-primaryDark shadow-lg shadow-blue-500/30 transition-all">
                    <i class="fas fa-sign-in-alt mr-2"></i> লগইন
                </a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto max-w-4xl px-4 py-6">

        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-slate-800">
                <i class="fas fa-users text-primary mr-2"></i> গ্রুপ লিডারবোর্ড
            </h1>
            <p class="text-sm text-slate-500">টিমভিত্তিক স্টাডি র‍্যাংকিং</p>
        </div>

        <!-- Filter -->
        <div class="flex flex-wrap items-center justify-center gap-2 mb-4">
            <select id="groupFilter" onchange="loadTeams()" class="px-4 py-2 rounded-xl border border-gray-200 text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none">
                <option value="all">সব গ্রুপ</option>
                <option value="HSC 27">HSC 27</option>
                <option value="HSC 26">HSC 26</option>
                <option value="SSC 27">SSC 27</option>
                <option value="SSC 26">SSC 26</option>
                <option value="Admission">Admission</option>
                <option value="Admission 25-26">Admission 25-26</option>
                <option value="Medical">Medical</option>
            </select>
            <select id="teamFilter" onchange="loadTeams()" class="px-4 py-2 rounded-xl border border-gray-200 text-sm focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none">
                <option value="all">সব টিম</option>
            </select>
        </div>

        <!-- Teams List -->
        <div id="teamsContainer" class="space-y-3">
            <div class="skeleton-card"><div class="skeleton" style="width:100%;height:60px;"></div></div>
            <div class="skeleton-card"><div class="skeleton" style="width:100%;height:60px;"></div></div>
            <div class="skeleton-card"><div class="skeleton" style="width:100%;height:60px;"></div></div>
        </div>

    </main>

    <!-- Toast -->
    <div id="toast-notification"></div>

    <script type="module">
        import { auth, onAuthStateChanged, db, collection, getDocs, query, where, doc, getDoc } from './firebase-config.js';

        let allUsers = [];
        let teams = {};

        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                authSection.innerHTML = `
                    <a href="profile.html" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 text-primary hover:bg-blue-100 transition-all">
                        <i class="fas fa-user-circle text-lg"></i>
                        <span class="text-sm font-medium hidden sm:inline">${user.displayName || 'User'}</span>
                    </a>
                    <button onclick="logout()" class="p-2 text-gray-400 hover:text-red-500">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                `;
            }
            loadTeams();
        });

        window.logout = function() {
            import('./firebase-config.js').then(({ signOut }) => {
                signOut(auth).then(() => window.location.reload());
            });
        };

        async function loadTeams() {
            const container = document.getElementById('teamsContainer');
            const groupFilter = document.getElementById('groupFilter').value;
            const teamFilter = document.getElementById('teamFilter').value;

            try {
                // Get all users
                const usersSnap = await getDocs(collection(db, 'users'));
                allUsers = [];
                usersSnap.forEach(doc => {
                    allUsers.push({ id: doc.id, ...doc.data() });
                });

                // Group by team
                teams = {};
                allUsers.forEach(user => {
                    const group = user.group || 'No Group';
                    const team = user.team || 'No Team';
                    const key = `${group}|${team}`;
                    if (!teams[key]) {
                        teams[key] = { group, team, members: [], totalStudy: 0 };
                    }
                    teams[key].members.push(user);
                });

                // Calculate total study for each team
                for (const key in teams) {
                    const team = teams[key];
                    let total = 0;
                    for (const member of team.members) {
                        const sessionsSnap = await getDocs(
                            query(collection(db, 'study_sessions'), where('userId', '==', member.id))
                        );
                        sessionsSnap.forEach(doc => {
                            total += doc.data().duration || 0;
                        });
                    }
                    team.totalStudy = total;
                }

                // Convert to array and sort
                let teamArray = Object.values(teams);
                
                // Apply filters
                if (groupFilter !== 'all') {
                    teamArray = teamArray.filter(t => t.group === groupFilter);
                }
                if (teamFilter !== 'all') {
                    teamArray = teamArray.filter(t => t.team === teamFilter);
                }

                teamArray.sort((a, b) => b.totalStudy - a.totalStudy);

                // Populate team filter options
                const teamSelect = document.getElementById('teamFilter');
                const currentVal = teamSelect.value;
                const uniqueTeams = [...new Set(Object.values(teams).map(t => t.team))];
                teamSelect.innerHTML = '<option value="all">সব টিম</option>';
                uniqueTeams.forEach(t => {
                    teamSelect.innerHTML += `<option value="${t}">${t}</option>`;
                });
                teamSelect.value = currentVal;

                if (teamArray.length === 0) {
                    container.innerHTML = `
                        <div class="card text-center py-12 text-slate-500">
                            <i class="fas fa-users-slash text-4xl text-slate-300 mb-3 block"></i>
                            <p>কোনো টিম নেই</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = '';
                let rank = 1;
                teamArray.forEach(team => {
                    const total = team.totalStudy;
                    const h = Math.floor(total / 3600);
                    const m = Math.floor((total % 3600) / 60);
                    const timeStr = h > 0 ? `${h}ঘ ${m}মি` : `${m}মি`;

                    let rankClass = 'team-rank-normal';
                    if (rank === 1) rankClass = 'team-rank-1';
                    else if (rank === 2) rankClass = 'team-rank-2';
                    else if (rank === 3) rankClass = 'team-rank-3';

                    const div = document.createElement('div');
                    div.className = 'team-card';
                    div.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-4">
                                <div class="team-rank ${rankClass}">${rank}</div>
                                <div>
                                    <div class="font-bold text-slate-800">${team.team}</div>
                                    <div class="text-xs text-slate-400">${team.group} • ${team.members.length} জন সদস্য</div>
                                </div>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-emerald-600">${timeStr}</div>
                                <div class="text-xs text-slate-400">মোট স্টাডি</div>
                            </div>
                        </div>
                        <div class="flex items-center mt-3 pt-3 border-t border-gray-100">
                            ${team.members.slice(0, 5).map(m => `
                                <div class="member-avatar" title="${m.name || 'User'}">
                                    ${(m.name || 'U').charAt(0).toUpperCase()}
                                </div>
                            `).join('')}
                            ${team.members.length > 5 ? `<div class="member-avatar" style="background:#E2E8F0;">+${team.members.length - 5}</div>` : ''}
                            <span class="text-xs text-slate-400 ml-2">${team.members.length} জন</span>
                        </div>
                    `;
                    container.appendChild(div);
                    rank++;
                });

            } catch (e) {
                console.error('Error loading teams:', e);
                showToast('❌ ডেটা লোড করতে ব্যর্থ');
            }
        }

        window.showToast = function(message) {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };
    </script>
</body>
</html>
