<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কুইজ ক্রিয়েটর - Study Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://kit.fontawesome.com/66ce5ae449.js" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        * { font-family: 'Hind Siliguri', sans-serif !important; }
        .question-card {
            background: white;
            border-radius: 12px;
            border: 1px solid #F1F5F9;
            padding: 16px;
            margin-bottom: 12px;
        }
        .option-input {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #F8FAFC;
            border-radius: 8px;
            margin-bottom: 4px;
        }
        .option-input input[type="radio"] {
            accent-color: #2563EB;
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen">

    <!-- Header -->
    <header class="sticky top-2 z-50 w-full flex justify-center px-4 mt-2">
        <div class="bg-white/80 backdrop-blur-xl border border-gray-200 rounded-full w-full max-w-5xl flex items-center gap-1 p-1.5 shadow-lg shadow-blue-500/5">
            <a href="index.html" class="flex items-center gap-2 pl-3 pr-2 shrink-0 no-underline">
                <i class="fas fa-graduation-cap text-2xl text-primary"></i>
                <span class="font-bold text-lg bg-gradient-to-r from-primary to-blue-400 bg-clip-text text-transparent hidden sm:block">Study Hub</span>
            </a>
            <div class="h-6 w-px bg-gray-200 mx-2 hidden sm:block"></div>
            <nav class="flex-grow flex items-center overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-1 px-2">
                    <a href="index.html" class="nav-link">হোম</a>
                    <a href="quiz-creator.html" class="nav-link active">কুইজ ক্রিয়েটর</a>
                </div>
            </nav>
            <div class="flex items-center gap-2 shrink-0 ml-auto" id="authSection">
                <a href="login.html" class="inline-flex items-center justify-center rounded-full bg-primary text-white px-5 py-1.5 text-sm font-medium hover:bg-primaryDark shadow-lg shadow-blue-500/30 transition-all">
                    <i class="fas fa-sign-in-alt mr-2"></i> লগইন
                </a>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="container mx-auto max-w-3xl px-4 py-6">

        <div class="text-center mb-6">
            <h1 class="text-2xl font-extrabold text-slate-800">
                <i class="fas fa-pen-to-square text-primary mr-2"></i> কুইজ ক্রিয়েটর
            </h1>
            <p class="text-sm text-slate-500">নতুন কুইজ তৈরি করুন</p>
        </div>

        <!-- Quiz Form -->
        <div class="card">
            <div class="mb-4">
                <label class="block text-sm font-semibold text-slate-700 mb-1">কুইজের শিরোনাম</label>
                <input type="text" id="quizTitle" placeholder="যেমন: গণিত অধ্যায় ৩" 
                       class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-semibold text-slate-700 mb-1">বিষয়</label>
                <input type="text" id="quizSubject" placeholder="যেমন: পদার্থবিজ্ঞান" 
                       class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm">
            </div>
        </div>

        <!-- Questions -->
        <div id="questionsContainer" class="mt-4">
            <div class="question-card">
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-semibold text-slate-700">প্রশ্ন ১</h4>
                    <button onclick="removeQuestion(this)" class="text-red-400 hover:text-red-600 text-sm">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <input type="text" placeholder="প্রশ্ন লিখুন..." 
                       class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm mb-3">
                <div class="space-y-1">
                    <div class="option-input">
                        <input type="radio" name="q1_correct" value="0" checked>
                        <input type="text" placeholder="অপশন ১" class="flex-1 bg-transparent border-none outline-none text-sm">
                    </div>
                    <div class="option-input">
                        <input type="radio" name="q1_correct" value="1">
                        <input type="text" placeholder="অপশন ২" class="flex-1 bg-transparent border-none outline-none text-sm">
                    </div>
                    <div class="option-input">
                        <input type="radio" name="q1_correct" value="2">
                        <input type="text" placeholder="অপশন ৩" class="flex-1 bg-transparent border-none outline-none text-sm">
                    </div>
                    <div class="option-input">
                        <input type="radio" name="q1_correct" value="3">
                        <input type="text" placeholder="অপশন ৪" class="flex-1 bg-transparent border-none outline-none text-sm">
                    </div>
                </div>
            </div>
        </div>

        <!-- Buttons -->
        <div class="flex flex-wrap gap-3 mt-4">
            <button onclick="addQuestion()" class="btn-secondary text-sm px-6 py-2">
                <i class="fas fa-plus mr-2"></i> প্রশ্ন যোগ করুন
            </button>
            <button onclick="saveQuiz()" class="btn-primary text-sm px-6 py-2">
                <i class="fas fa-save mr-2"></i> কুইজ সেভ করুন
            </button>
            <button onclick="previewQuiz()" class="btn-secondary text-sm px-6 py-2">
                <i class="fas fa-eye mr-2"></i> প্রিভিউ
            </button>
        </div>

    </main>

    <!-- Toast -->
    <div id="toast-notification"></div>

    <script type="module">
        import { auth, onAuthStateChanged, db, addDoc, collection, serverTimestamp } from './firebase-config.js';

        let currentUser = null;
        let questionCount = 1;

        onAuthStateChanged(auth, (user) => {
            const authSection = document.getElementById('authSection');
            if (user) {
                currentUser = user;
                authSection.innerHTML = `
                    <a href="profile.html" class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-blue-50 text-primary hover:bg-blue-100 transition-all">
                        <i class="fas fa-user-circle text-lg"></i>
                        <span class="text-sm font-medium hidden sm:inline">${user.displayName || 'User'}</span>
                    </a>
                    <button onclick="logout()" class="p-2 text-gray-400 hover:text-red-500">
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                `;
            } else {
                authSection.innerHTML = `
                    <a href="login.html" class="inline-flex items-center justify-center rounded-full bg-primary text-white px-5 py-1.5 text-sm font-medium hover:bg-primaryDark shadow-lg shadow-blue-500/30 transition-all">
                        <i class="fas fa-sign-in-alt mr-2"></i> লগইন
                    </a>
                `;
            }
        });

        window.logout = function() {
            import('./firebase-config.js').then(({ signOut }) => {
                signOut(auth).then(() => window.location.reload());
            });
        };

        window.addQuestion = function() {
            questionCount++;
            const container = document.getElementById('questionsContainer');
            const div = document.createElement('div');
            div.className = 'question-card';
            div.innerHTML = `
                <div class="flex justify-between items-center mb-3">
                    <h4 class="font-semibold text-slate-700">প্রশ্ন ${questionCount}</h4>
                    <button onclick="removeQuestion(this)" class="text-red-400 hover:text-red-600 text-sm">
                        <i class="fas fa-trash"></i>
                    </button>
                </div>
                <input type="text" placeholder="প্রশ্ন লিখুন..." 
                       class="w-full px-4 py-2 rounded-xl border border-gray-200 focus:border-primary focus:ring-2 focus:ring-primary/20 outline-none text-sm mb-3">
                <div class="space-y-1">
                    ${[0,1,2,3].map(i => `
                        <div class="option-input">
                            <input type="radio" name="q${questionCount}_correct" value="${i}" ${i===0?'checked':''}>
                            <input type="text" placeholder="অপশন ${i+1}" class="flex-1 bg-transparent border-none outline-none text-sm">
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(div);
        };

        window.removeQuestion = function(btn) {
            const card = btn.closest('.question-card');
            if (document.querySelectorAll('.question-card').length <= 1) {
                showToast('⚠️ কমপক্ষে ১টি প্রশ্ন থাকতে হবে');
                return;
            }
            card.remove();
            // Renumber
            document.querySelectorAll('.question-card').forEach((el, i) => {
                el.querySelector('h4').textContent = `প্রশ্ন ${i + 1}`;
            });
            questionCount = document.querySelectorAll('.question-card').length;
        };

        window.saveQuiz = async function() {
            if (!currentUser) { showToast('❌ লগইন করুন'); return; }

            const title = document.getElementById('quizTitle').value.trim();
            const subject = document.getElementById('quizSubject').value.trim();
            if (!title) { showToast('⚠️ কুইজের শিরোনাম দিন'); return; }

            const questionCards = document.querySelectorAll('.question-card');
            const questions = [];

            questionCards.forEach((card, idx) => {
                const qText = card.querySelector('input[type="text"]')?.value.trim();
                const options = card.querySelectorAll('.option-input input[type="text"]');
                const correctRadio = card.querySelector(`input[name="q${idx+1}_correct"]:checked`);
                const correctIndex = correctRadio ? parseInt(correctRadio.value) : 0;

                const optionTexts = [];
                options.forEach(opt => optionTexts.push(opt.value.trim()));

                if (qText && optionTexts.some(o => o)) {
                    questions.push({
                        question: qText,
                        options: optionTexts,
                        correct: correctIndex
                    });
                }
            });

            if (questions.length === 0) { showToast('⚠️ কমপক্ষে ১টি প্রশ্ন দিন'); return; }

            try {
                await addDoc(collection(db, 'quizzes'), {
                    creatorId: currentUser.uid,
                    creatorName: currentUser.displayName || 'User',
                    title: title,
                    subject: subject || 'General',
                    questions: questions,
                    totalQuestions: questions.length,
                    createdAt: serverTimestamp(),
                    isActive: true
                });

                showToast('✅ কুইজ সেভ করা হয়েছে!');
                // Reset
                document.getElementById('quizTitle').value = '';
                document.getElementById('quizSubject').value = '';
                document.querySelectorAll('.question-card').forEach((el, i) => {
                    if (i === 0) {
                        el.querySelector('input[type="text"]').value = '';
                        el.querySelectorAll('.option-input input[type="text"]').forEach(opt => opt.value = '');
                    } else {
                        el.remove();
                    }
                });
                questionCount = 1;

            } catch (e) {
                console.error('Error saving quiz:', e);
                showToast('❌ কুইজ সেভ করতে ব্যর্থ');
            }
        };

        window.previewQuiz = function() {
            const title = document.getElementById('quizTitle').value.trim() || 'নতুন কুইজ';
            const questionCards = document.querySelectorAll('.question-card');
            let preview = `📝 ${title}\n\n`;

            questionCards.forEach((card, idx) => {
                const qText = card.querySelector('input[type="text"]')?.value.trim() || `প্রশ্ন ${idx+1}`;
                preview += `${idx+1}. ${qText}\n`;
                const options = card.querySelectorAll('.option-input input[type="text"]');
                options.forEach((opt, oi) => {
                    preview += `   ${String.fromCharCode(65 + oi)}. ${opt.value.trim() || '...'}\n`;
                });
                preview += '\n';
            });

            alert(preview);
        };

        window.showToast = function(message) {
            const toast = document.getElementById('toast-notification');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        };
    </script>
</body>
</html>
